apiVersion: apps/v1
kind: Deployment
metadata:
  name: iwishiknewthat-api
  labels:
    app.kubernetes.io/name: iwishiknewthat
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iwishiknewthat
      app.kubernetes.io/component: api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iwishiknewthat
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: iwishiknewthat-api
          imagePullPolicy: Always
          workingDir: /app
          command:
            - /usr/local/bin/python
          args:
            - scripts/link_service.py
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "8787"
          envFrom:
            - secretRef:
                name: iwishiknewthat-deploy-webhook
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: db
              mountPath: /app/var
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: iwishiknewthat-db
