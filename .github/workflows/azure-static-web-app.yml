name: Deploy Azure Static Web App

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - link-added

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -L https://github.com/getzola/zola/releases/download/v0.22.1/zola-v0.22.1-x86_64-unknown-linux-gnu.tar.gz -o zola.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola

      - name: Fetch links from API
        run: |
          curl -fsSL "${LINK_API_URL}/links" -o data/links.json
        env:
          LINK_API_URL: ${{ secrets.LINK_API_URL }}

      - name: Build site
        run: zola build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: public
          skip_app_build: true
